blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/diagnos-tech/webtessera/security/advisories/new
    about: >-
      Do not open a public issue for a security problem. Report it privately; see SECURITY.md for what is in scope.
  - name: Problem in Tessera itself
    url: https://github.com/transparency-dev/tessera/issues
    about: >-
      webtessera ports Tessera. If the same problem exists in the Go original, report it to the Tessera project (and tell us here if the port inherits it).
  - name: Read the contributor guide
    url: https://github.com/diagnos-tech/webtessera/blob/main/CONTRIBUTING.md
    about: Setup, scripts, the fidelity rules and the ADR process.
