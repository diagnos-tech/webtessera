name: Feature request
description: Propose a port, an improvement or an addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        webtessera is a **faithful port** of Tessera: new behaviour that Tessera does not have is the exception, not the rule, and each such addition needs an ADR (see [CONTRIBUTING.md](https://github.com/diagnos-tech/webtessera/blob/main/CONTRIBUTING.md#architecture-decision-records)). Tell us which kind of request this is.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - Port something from Tessera that is not ported yet
        - Support another runtime or storage backend
        - Add API that Tessera does not have
        - Developer experience, tooling or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you? Describe the use case, not only the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? For a port, name the upstream Go files (see `docs/PORTING-MAP.md`); for new API, sketch the signature.
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does Tessera have this?
      description: Faithfulness is the project's main constraint, so this shapes the discussion.
      options:
        - Yes, it is in Tessera (this is a port)
        - No, it would be new API
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including doing this outside the library.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I am willing to work on this.
        - label: I searched existing issues and `docs/PORTING-MAP.md`.
          required: true
