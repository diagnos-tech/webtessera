# Builds the npm tarballs once, then checks that exact file the way a consumer meets it.
# release.yml publishes the bytes built here, so what is tested is what ships.
#
# Two jobs, split on trust:
#
# - `build` installs from the lockfile only, packs, records the SHA-256 of what it produced as
#   job outputs, and uploads the `package` artifact. Nothing it runs comes from outside the
#   lockfile, and it ends the moment the artifact is up.
# - `check` downloads that artifact and uses it read-only. It runs publint, Are the Types
#   Wrong? and the smoke test, which fetch packages that no lockfile pins (`pnpm dlx`, and the
#   `npm install` inside the smoke test). Code from those packages can therefore run in this
#   job, so the job cannot be allowed to change what ships: it holds no secrets and no
#   permissions beyond reading the repository, and the digests it checks against, and that
#   release.yml checks again before publishing, come from `build`'s outputs. Those travel
#   outside the artifact store, so replacing the artifact later is detected.
#
# The artifact holds two tarballs with identical contents. `webtessera-<version>.tgz` goes to
# npm. `<owner>-webtessera-<version>.tgz` differs only in its package name (@<owner>/webtessera)
# and goes to GitHub Packages, whose npm registry accepts only packages scoped to the owner.
# Deriving it here, on every run, means a bug in the derivation fails a pull request instead
# of the first release.
#
# publint and Are the Types Wrong? run at pinned versions, so a new release of either cannot
# break a build that did not change. Nothing else uses them, so they stay out of package.json
# and the lockfile; the price is that Dependabot cannot see these two versions, so bump them
# by hand now and then.
#
# Reusable workflow, called by ci.yml.
name: Package

on:
  workflow_call:
    outputs:
      npm-sha256:
        description: SHA-256 of webtessera-<version>.tgz, recorded when it was packed.
        value: ${{ jobs.build.outputs.npm-sha256 }}
      scoped-sha256:
        description: SHA-256 of <owner>-webtessera-<version>.tgz, recorded when it was derived.
        value: ${{ jobs.build.outputs.scoped-sha256 }}

permissions:
  contents: read

env:
  PUBLINT_VERSION: 0.3.25
  ATTW_VERSION: 0.18.5

jobs:
  build:
    name: Build the tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      npm-sha256: ${{ steps.digests.outputs.npm-sha256 }}
      scoped-sha256: ${{ steps.digests.outputs.scoped-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--frozen-lockfile`: the dependencies are exactly the ones the lockfile pins.
      - uses: ./.github/actions/setup

      # `prepack` cleans dist/ and builds it, so the tarball never contains a stale build.
      - name: Build and pack
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"

      # The script prints the path of the tarball it wrote, and nothing else, on stdout.
      - name: Derive the GitHub Packages variant
        run: |
          set -euo pipefail
          scoped="$(node scripts/release/rescope.mjs "$OUT_DIR/webtessera-$VERSION.tgz" --scope "$GITHUB_REPOSITORY_OWNER" --out-dir "$OUT_DIR")"
          echo "SCOPED_TARBALL=$scoped" >> "$GITHUB_ENV"

      # Recorded straight after packing, before the artifact leaves this job.
      - name: Record the digests
        id: digests
        run: |
          set -euo pipefail
          npm_sha="$(sha256sum "$OUT_DIR/webtessera-$VERSION.tgz" | cut -d' ' -f1)"
          scoped_sha="$(sha256sum "$SCOPED_TARBALL" | cut -d' ' -f1)"
          {
            echo "npm-sha256=$npm_sha"
            echo "scoped-sha256=$scoped_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Tarballs"
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$(basename "$OUT_DIR/webtessera-$VERSION.tgz")\` | \`$npm_sha\` |"
            echo "| \`$(basename "$SCOPED_TARBALL")\` | \`$scoped_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ env.OUT_DIR }}/*.tgz
          if-no-files-found: error
          retention-days: 14

  check:
    name: Check the tarballs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm and Node only: the tools below are fetched on demand, and nothing here needs the
      # workspace dependencies or the store cache.
      - uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Download the tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      # What is checked below must be what `build` produced, byte for byte.
      - name: Verify the tarballs against the recorded digests
        env:
          NPM_SHA256: ${{ needs.build.outputs.npm-sha256 }}
          SCOPED_SHA256: ${{ needs.build.outputs.scoped-sha256 }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "TARBALL=$RUNNER_TEMP/package/webtessera-$version.tgz" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/package"
          printf '%s  %s\n' \
            "$NPM_SHA256" "webtessera-$version.tgz" \
            "$SCOPED_SHA256" "${GITHUB_REPOSITORY_OWNER,,}-webtessera-$version.tgz" |
            sha256sum --check --strict
          # Exactly the two verified files: nothing else rides along in the artifact.
          test "$(find . -type f | wc -l)" -eq 2

      - name: List the package contents
        run: tar -tzf "$TARBALL" | sort

      # Installs the tarball into a scratch project: licence files present, no test files or
      # Node built-ins shipped, every `exports` entry importable.
      - name: Smoke-test the tarball
        run: node scripts/smoke-pack.mjs "$TARBALL"

      - name: Check the package shape (publint)
        run: pnpm dlx "publint@$PUBLINT_VERSION" run --strict "$TARBALL"

      - name: Check that the types resolve for consumers (Are the Types Wrong?)
        run: pnpm dlx "@arethetypeswrong/cli@$ATTW_VERSION" "$TARBALL" --profile esm-only
