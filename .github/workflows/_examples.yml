# Builds and tests every example under examples/, so a change to the public API cannot silently
# break the code people copy from.
#
# Generic by design: each example defines a `ci` script in its package.json, and this job runs
# whichever examples exist. Adding an example needs no change here.
#
# Reusable workflow, called by ci.yml.
name: Examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # client-only and session-receipts run their browser tests in a real Chromium.
      - uses: ./.github/actions/setup-browsers
      # The examples import the library by name, which resolves to its built dist/ (the root
      # `prepare` script links the repository root into node_modules). Their `ci` scripts do not
      # rebuild it: `bun run --filter` starts them all at once, and concurrent builds would
      # race on dist/.
      - run: bun run build
      # `./examples/*` is a path filter, so a new example is picked up without touching this
      # file. Deliberately no `--if-present`: Bun already skips a package that has no `ci`
      # script, and the flag would only turn "no example has one" from a failure ("No packages
      # matched the filter") into a silent pass. (That is what happened before every example
      # had a `ci` script: the job passed with nothing to run.)
      - name: Run the examples' ci scripts
        run: bun run --filter './examples/*' ci
