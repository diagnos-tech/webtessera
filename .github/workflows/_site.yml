# Builds the landing page (site/) and smoke-tests it in Chromium, so a broken page is caught on
# the pull request that breaks it rather than when pages.yml deploys it.
#
# Reusable workflow, called by ci.yml. Deployment is pages.yml's job, not this one's.
name: Site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-browsers
      # `ci` is the package's own definition of "builds and passes its smoke test".
      - run: pnpm --filter webtessera-site run ci
