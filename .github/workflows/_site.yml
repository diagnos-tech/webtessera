# Builds the website (site/, an Astro site generated from the repository) and smoke-tests every
# page in Chromium, so a broken page, link or budget is caught on the pull request that breaks it
# rather than when pages.yml deploys it.
#
# Reusable workflow, called by ci.yml. Deployment is pages.yml's job, not this one's.
name: Site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-browsers
      # `ci` is the package's own definition of "builds, type-checks and passes its smoke test".
      # Astro runs on the Node.js that the setup action installs (22.12 or later, from .nvmrc).
      - run: bun run --filter webtessera-site ci
